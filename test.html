<!DOCTYPE html>
<html>
<head>
    <title>Audio Test</title>
</head>
<body>
    <h1>Simple Audio Test</h1>
    <button onclick="testAudio()">Test Local Audio</button>
    <br><br>
    <audio id="testAudio" controls></audio>
    
    <script>
    function testAudio() {
        console.log('Testing audio...');
        const audio = document.getElementById('testAudio');
        
        // Test with a simple localhost URL (no auth)
        const testUrl = 'http://localhost:8001/health';
        console.log('Setting audio src to:', testUrl);
        
        audio.src = testUrl;
        audio.load();
        
        audio.addEventListener('error', (e) => {
            console.error('Audio error:', e);
        });
        
        audio.addEventListener('loadstart', () => {
            console.log('Audio load started');
        });
    }
    </script>
</body>
</html>
