<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Audio Server</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .dashboard-header {
            background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dashboard-header h1 {
            font-size: 2em;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logout-btn {
            background: #e53e3e;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .logout-btn:hover {
            background: #c53030;
        }

        .dashboard-content {
            padding: 30px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .dashboard-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            border-left: 5px solid #667eea;
        }

        .dashboard-card h3 {
            color: #4a5568;
            margin-bottom: 15px;
        }

        .schedule-item {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid #e2e8f0;
        }

        .schedule-active {
            border-color: #48bb78;
            background: #f0fff4;
        }

        .schedule-inactive {
            border-color: #f56565;
            background: #fff5f5;
        }

        .audio-player {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }

        .audio-title {
            font-size: 1.1em;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 10px;
        }

        audio {
            width: 100%;
            margin-top: 10px;
        }

        .status {
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .status-available {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-unavailable {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            text-align: center;
            color: #667eea;
            padding: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            margin-right: 10px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a67d8;
        }
        
        /* Collection Panel Styles */
        .collection-panel {
            background: white;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
        }
        
        .collection-header {
            background: #f8f9fa;
            padding: 15px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e2e8f0;
            transition: background-color 0.2s ease;
        }
        
        .collection-header:hover {
            background: #e9ecef;
        }
        
        .collection-header.active {
            background: #667eea;
            color: white;
        }
        
        .collection-title {
            font-weight: 600;
            font-size: 1.1em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .collection-toggle {
            font-size: 1.2em;
            transition: transform 0.2s ease;
        }
        
        .collection-toggle.expanded {
            transform: rotate(90deg);
        }
        
        .collection-content {
            padding: 15px 20px;
            display: none;
        }
        
        .collection-content.show {
            display: block;
        }
        
        .collection-info {
            background: #f0f4ff;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 0.9em;
            color: #4a5568;
        }
        
        .audio-file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            margin: 8px 0;
            background: #fafafa;
            transition: all 0.2s ease;
        }
        
        .audio-file-item:hover {
            background: #f0f4ff;
            border-color: #667eea;
        }
        
        .play-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background-color 0.2s ease;
        }
        
        .play-btn:hover {
            background: #5a67d8;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1>🎵 Your Audio Dashboard</h1>
            <div class="user-info">
                <span id="user-name">Loading...</span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="dashboard-content">
            <div id="loading" class="loading">Loading your dashboard...</div>
            
            <div id="main-content" style="display: none;">
                <div class="status" id="status-indicator">
                    <span id="status-text">Checking availability...</span>
                </div>

                <div class="dashboard-grid">
                    <div class="dashboard-card">
                        <h3>📅 Your Schedules</h3>
                        <div id="user-schedules">Loading schedules...</div>
                    </div>

                    <div class="dashboard-card">
                        <h3>📊 Quick Stats</h3>
                        <div id="user-stats">
                            <div id="coordinator-info" style="margin-bottom: 15px; padding: 10px; background: #e6fffa; border-radius: 5px; border-left: 3px solid #38b2ac;">
                                <div style="font-weight: 600; color: #2c7a7b; margin-bottom: 5px;">👨‍🏫 Your Coordinator</div>
                                <div id="coordinator-details">Loading...</div>
                            </div>
                            <p>Total Schedules: <span id="total-schedules">0</span></p>
                            <p>Active Now: <span id="active-schedules">0</span></p>
                            <p>Available Files: <span id="available-files">0</span></p>
                        </div>
                    </div>
                </div>

                <div class="dashboard-card">
                    <h3>🎵 Currently Available Audio Files</h3>
                    
                    <!-- Single Audio Player -->
                    <div id="current-player" style="display: none; background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                        <div id="current-track-name" style="font-weight: bold; margin-bottom: 10px;"></div>
                        <audio id="main-audio" controls preload="none" style="width: 100%;" controlslist="nodownload">
                            Your browser does not support the audio element.
                        </audio>
                    </div>
                    
                    <div id="audio-files">No files available at this time.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let userToken = localStorage.getItem('authToken');
        let currentUser = null;

        // Main server URL (for authentication, admin tasks)
        const MAIN_SERVER_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://localhost:8000' 
            : 'https://misty-sunset-29095.pktriot.net';
        
        // For GitHub Pages deployment, override with your actual server URL
        const isGitHubPages = window.location.hostname.includes('github.io');
        const PRODUCTION_SERVER_URL = isGitHubPages ? 'https://misty-sunset-29095.pktriot.net' : MAIN_SERVER_URL;
        
        // Streaming server URL (will be updated after login)
        let STREAMING_SERVER_URL = isGitHubPages ? PRODUCTION_SERVER_URL : MAIN_SERVER_URL;
        
        // Legacy API_BASE_URL for backward compatibility
        const API_BASE_URL = isGitHubPages ? PRODUCTION_SERVER_URL : MAIN_SERVER_URL;
        
        // Check authentication on load
        if (!userToken) {
            window.location.href = 'login.html';
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadDashboard();
            setInterval(refreshAudioFiles, 30000); // Refresh every 30 seconds
        });

        async function loadDashboard() {
            try {
                // Get user info from token
                const token = localStorage.getItem('authToken');
                if (token) {
                    try {
                        const payload = JSON.parse(atob(token.split('.')[1]));
                        currentUser = { name: payload.name, email: payload.email };
                        document.getElementById('user-name').textContent = currentUser.name;
                    } catch (e) {
                        console.error('Failed to parse token:', e);
                        logout();
                        return;
                    }
                } else {
                    logout();
                    return;
                }

                // Get student info and assigned streaming server
                try {
                    const response = await apiCall('/student/info');
                    const studentInfo = response.student || {};
                    if (studentInfo.assignedStreamingServer) {
                        // Map streaming server domains to appropriate URLs
                        const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
                        
                        if (isLocalhost) {
                            // Development mode: Map domains to localhost ports
                            const domainToPortMap = {
                                'classstreamer2.mediastreamer.app': 8002,
                                'classstreamer3.mediastreamer.app': 8003,
                                'classstreamer4.mediastreamer.app': 8004,
                                'classstreamer5.mediastreamer.app': 8005
                            };
                            
                            const port = domainToPortMap[studentInfo.assignedStreamingServer];
                            if (port) {
                                STREAMING_SERVER_URL = `http://localhost:${port}`;
                            } else {
                                // Fallback to main server if mapping not found
                                STREAMING_SERVER_URL = MAIN_SERVER_URL;
                            }
                        } else {
                            // Production mode: Use the actual domain with https
                            STREAMING_SERVER_URL = `https://${studentInfo.assignedStreamingServer}`;
                        }
                        
                        console.log(`🎧 Assigned to streaming server: ${STREAMING_SERVER_URL}`);
                    }
                } catch (error) {
                    console.warn('Could not get streaming server assignment:', error);
                }

                // Load user-specific data
                await Promise.all([
                    loadUserSchedules(),
                    loadAvailableFiles(),
                    updateStats()
                ]);

                document.getElementById('loading').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            } catch (error) {
                console.error('Failed to load dashboard:', error);
                logout();
            }
        }

        async function loadUserSchedules() {
            try {
                const response = await apiCall('/student/schedules');
                displayUserSchedules(response.schedules || []);
            } catch (error) {
                document.getElementById('user-schedules').innerHTML = '<p>Error loading schedules</p>';
            }
        }

        async function loadAvailableFiles() {
            try {
                const data = await apiCall('/student/available-files');
                // Extract all files from collections and create progress object
                const allFiles = [];
                const collectionsProgress = {};
                const collectionsObj = {};
                
                if (data.collections && data.collections.length > 0) {
                    data.collections.forEach(collection => {
                        // Convert array to object format expected by displayCollectionPanels
                        collectionsObj[collection.collectionId] = collection;
                        
                        if (collection.files) {
                            allFiles.push(...collection.files);
                        }
                        if (collection.progress) {
                            collectionsProgress[collection.collectionId] = collection.progress;
                        }
                    });
                }
                
                displayAvailableFiles(allFiles, collectionsObj, collectionsProgress);
            } catch (error) {
                document.getElementById('audio-files').innerHTML = '<p>Error loading files</p>';
            }
        }

        async function updateStats() {
            try {
                const response = await apiCall('/student/stats');
                const stats = response.stats || {};
                document.getElementById('total-schedules').textContent = stats.totalSchedules || 0;
                document.getElementById('active-schedules').textContent = stats.activeSchedules || 0;
                document.getElementById('available-files').textContent = stats.availableFiles || 0;
                
                // Display coordinator information
                const coordinatorDetails = document.getElementById('coordinator-details');
                if (stats.coordinatorName) {
                    coordinatorDetails.innerHTML = `
                        <div style="color: #2c7a7b; font-size: 0.9em;">
                            <strong>${stats.coordinatorName}</strong><br>
                            ${stats.coordinatorEmail}<br>
                            <span style="color: #4a5568;">${stats.instituteName}</span>
                        </div>
                    `;
                } else {
                    coordinatorDetails.innerHTML = '<span style="color: #a0aec0;">Not assigned</span>';
                }
            } catch (error) {
                console.error('Failed to load stats:', error);
                document.getElementById('coordinator-details').innerHTML = '<span style="color: #e53e3e;">Error loading coordinator info</span>';
            }
        }

        function displayUserSchedules(schedules) {
            const container = document.getElementById('user-schedules');
            
            if (!schedules || schedules.length === 0) {
                container.innerHTML = '<p>No schedules assigned to you yet.</p>';
                return;
            }

            container.innerHTML = schedules.map(schedule => `
                <div class="schedule-item ${schedule.isActive ? 'schedule-active' : 'schedule-inactive'}">
                    <strong>${schedule.name}</strong><br>
                    <small>${formatDaysOfWeek(schedule.dayOfWeek)}: ${schedule.startTime} - ${schedule.endTime}</small>
                </div>
            `).join('');
        }

        function displayAvailableFiles(files, collections, collectionsProgress) {
            const container = document.getElementById('audio-files');
            const statusIndicator = document.getElementById('status-indicator');
            const statusText = document.getElementById('status-text');

            if (files.length === 0) {
                container.innerHTML = '<p>No audio files are currently available.</p>';
                statusIndicator.className = 'status status-unavailable';
                statusText.textContent = 'No audio files available at this time';
                document.getElementById('current-player').style.display = 'none';
                return;
            }

            statusIndicator.className = 'status status-available';
            statusText.textContent = `${files.length} audio file(s) currently available`;

            // Check if we have collections data for the new grouped view
            if (Object.keys(collections).length > 0) {
                displayCollectionPanels(collections, collectionsProgress);
            } else {
                // Fallback to old simple list view
                displaySimpleFileList(files);
            }
        }
        
        function displayCollectionPanels(collections, collectionsProgress) {
            const container = document.getElementById('audio-files');
            
            const collectionsHtml = Object.entries(collections).map(([collectionId, collection]) => {
                const progress = collectionsProgress[collectionId] || {};
                const fileCount = collection.files.length;
                const progressInfo = progress.totalFiles ? 
                    `📊 ${progress.completedFiles} completed • ${progress.visibleFiles} visible • ${progress.remainingFiles} remaining` :
                    `📁 ${fileCount} files available`;
                
                const filesHtml = collection.files.map(file => `
                    <div class="audio-file-item">
                        <div class="audio-title" style="flex: 1; font-weight: 500;">${file.name}</div>
                        <button class="play-btn" onclick="playAudio('${file.name}', '${API_BASE_URL}/student/${encodeURIComponent(file.name)}')">
                            ▶ Play
                        </button>
                    </div>
                `).join('');
                
                return `
                    <div class="collection-panel">
                        <div class="collection-header" onclick="toggleCollection('${collectionId}')">
                            <div class="collection-title">
                                <span class="collection-toggle" id="toggle-${collectionId}">▶</span>
                                <span>🎵 ${collection.collectionName || collection.name}</span>
                            </div>
                            <span style="font-size: 0.9em; opacity: 0.8;">${fileCount} files</span>
                        </div>
                        <div class="collection-content" id="content-${collectionId}">
                            <div class="collection-info">
                                ${progressInfo}
                            </div>
                            ${filesHtml}
                        </div>
                    </div>
                `;
            }).join('');
            
            container.innerHTML = collectionsHtml;
        }
        
        function displaySimpleFileList(files) {
            const container = document.getElementById('audio-files');
            
            // Create file list with play buttons (fallback to old view)
            container.innerHTML = files.map((file, index) => `
                <div class="audio-file-item">
                    <div class="audio-title" style="flex: 1; font-weight: 500;">${file.name}</div>
                    <button class="play-btn" onclick="playAudio('${file.name}', '${API_BASE_URL}/student/${encodeURIComponent(file.name)}')">
                        ▶ Play
                    </button>
                </div>
            `).join('');
        }
        
        function toggleCollection(collectionId) {
            const content = document.getElementById(`content-${collectionId}`);
            const toggle = document.getElementById(`toggle-${collectionId}`);
            const header = content.previousElementSibling;
            
            if (content.classList.contains('show')) {
                content.classList.remove('show');
                toggle.classList.remove('expanded');
                header.classList.remove('active');
                toggle.textContent = '▶';
            } else {
                content.classList.add('show');
                toggle.classList.add('expanded');
                header.classList.add('active');
                toggle.textContent = '▼';
            }
        }

        function playAudio(fileName, audioUrl) {
            const player = document.getElementById('current-player');
            const trackName = document.getElementById('current-track-name');
            const audio = document.getElementById('main-audio');
            
            // Show the player
            player.style.display = 'block';
            
            // Set track name
            trackName.textContent = `Now Playing: ${fileName}`;
            
            // Add authorization token to audio URL
            const token = localStorage.getItem('authToken');
            const authenticatedUrl = `${audioUrl}?token=${encodeURIComponent(token)}`;
            
            // Set audio source
            audio.src = authenticatedUrl;
            
            // Play the audio
            audio.load();
            audio.play().catch(error => {
                console.error('Error playing audio:', error);
                alert('Error playing audio file. Please check your connection and try again.');
            });
            
            console.log(`Playing: ${fileName}`);
        }

        function formatDaysOfWeek(dayOfWeek) {
            const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            
            if (dayOfWeek === '*') {
                return 'Every day';
            }
            
            const days = dayOfWeek.split(',').map(d => parseInt(d.trim()));
            
            if (days.length === 5 && days.every(d => d >= 1 && d <= 5)) {
                return 'Weekdays (Mon-Fri)';
            }
            
            if (days.length === 2 && days.includes(0) && days.includes(6)) {
                return 'Weekends (Sat-Sun)';
            }
            
            if (days.length === 1) {
                return dayNames[days[0]];
            }
            
            return days.map(d => dayNames[d]).join(', ');
        }

        async function refreshAudioFiles() {
            await loadAvailableFiles();
            await updateStats();
        }

        async function apiCall(endpoint, method = 'GET', data = null) {
            const token = localStorage.getItem('authToken');
            const options = {
                method,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                credentials: 'include'
            };
            
            if (data) {
                options.body = JSON.stringify(data);
            }
            
            const response = await fetch(`${API_BASE_URL}${endpoint}`, options);
            
            if (response.status === 401) {
                logout();
                return;
            }
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            
            return await response.json();
        }

        function logout() {
            localStorage.removeItem('authToken');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
